# SUPER EVİL — buluttan Android derlemesi (imzalı AAB + APK)
# Çalıştırma: GitHub'da repo → Actions → "Android (AAB + APK)" → Run workflow
# Google girişi/bulut kayıt isteğe bağlı: deponun ana klasörüne Firebase'den indirdiğin google-services.json dosyasını yükle (bkz. BASLA-BURADAN.md, ADIM 7)
name: Android (AAB + APK)

on:
  workflow_dispatch:
    inputs:
      ad_test:
        description: "Google TEST reklamlarını kullan (yalnız denemeler için; Play Store sürümünde KAPALI bırak)"
        type: boolean
        default: false
      privacy_url:
        description: "Gizlilik politikası adresi (https://...) — oyunun ayarlarında bağlantı olarak görünür"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["paket.zip"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Paketi aç
        run: |
          mkdir -p build
          unzip -q paket.zip -d build
          D=$(dirname "$(find build -name game.html | head -n 1)")
          echo "PKG_DIR=$D" >> "$GITHUB_ENV"
          echo "Paket klasörü: $D"
          # Google girişi + bulut kayıt: deponun ana klasörüne google-services.json konduysa kullan (yoksa özellik kapalı kalır)
          if [ -f "$GITHUB_WORKSPACE/google-services.json" ]; then
            cp "$GITHUB_WORKSPACE/google-services.json" "$D/google-services.json"
            echo "FIREBASE=1" >> "$GITHUB_ENV"
            echo "google-services.json bulundu: Google girişi AÇIK olacak"
          else
            echo "google-services.json yok: Google girişi KAPALI (yalnızca yerel profil)"
          fi
          ls -la "$D"

      - name: Bağımlılıkları kur
        working-directory: ${{ env.PKG_DIR }}
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund three@0.128.0 cannon@0.6.2
          if [ "$FIREBASE" = "1" ]; then
            npm install --no-audit --no-fund @capacitor-firebase/authentication@^8.0.0 firebase
          fi

      - name: Oyunu hazırla (three.js ve cannon.js yerel kopya)
        working-directory: ${{ env.PKG_DIR }}
        env:
          AD_TEST: ${{ inputs.ad_test }}
          PRIVACY_URL: ${{ inputs.privacy_url }}
        run: node prepare.js www

      - name: Android projesini oluştur
        working-directory: ${{ env.PKG_DIR }}
        run: npx cap add android

      - name: Simge ve açılış görselleri
        working-directory: ${{ env.PKG_DIR }}
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Android ayarları (yatay mod, tam ekran, AdMob, Google girişi, sürüm)
        working-directory: ${{ env.PKG_DIR }}
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: node prepare.js android

      - name: Capacitor eşitle
        working-directory: ${{ env.PKG_DIR }}
        run: npx cap sync android

      - name: Android SDK lisansları / platform 36
        continue-on-error: true
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Derle (AAB + APK)
        working-directory: ${{ env.PKG_DIR }}/android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease assembleDebug

      - name: İmzala ve topla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          OUT="$GITHUB_WORKSPACE/out"; mkdir -p "$OUT"
          A="$PKG_DIR/android/app/build/outputs"
          cp "$A/apk/debug/app-debug.apk" "$OUT/SUPER-EVIL-test-debug.apk"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            # AAB (Play Console'a yüklenecek dosya)
            cp "$A/bundle/release/app-release.aab" "$OUT/SUPER-EVIL-playstore.aab"
            jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -sigalg SHA256withRSA -digestalg SHA-256 "$OUT/SUPER-EVIL-playstore.aab" upload
            # APK (telefona doğrudan kurulabilir)
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            "$BT/zipalign" -p -f 4 "$A/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --out "$OUT/SUPER-EVIL-release.apk" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/upload.jks"
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD gizli anahtarları yok; imzalı AAB üretilmedi (yalnızca test APK'sı)."
          fi
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: SUPER-EVIL-android
          path: out/*
          if-no-files-found: error
